<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#5b21b6" />
  <title>Plaquitas QR | Registro de mascotas</title>
  <meta name="description" content="Registra a tu mascota, genera su código único y comparte su perfil público." />
  <style>
    :root{
      --purple-950:#2e1065;
      --purple-900:#3b0764;
      --purple-800:#4c1d95;
      --purple-700:#5b21b6;
      --purple-600:#7c3aed;
      --purple-500:#8b5cf6;
      --pink-500:#ec4899;
      --pink-300:#f9a8d4;
      --pink-100:#fce7f3;
      --white:#ffffff;
      --ink:#24153f;
      --muted:#776989;
      --line:rgba(92,33,182,.14);
      --glass:rgba(255,255,255,.74);
      --shadow:0 22px 60px rgba(76,29,149,.16);
      --shadow-soft:0 12px 30px rgba(76,29,149,.10);
      --radius-xl:32px;
      --radius-lg:24px;
      --radius-md:18px;
      --radius-sm:14px;
      --success:#169b62;
      --danger:#d9365e;
      --warning:#d97706;
      --bg:
        radial-gradient(circle at 10% 0%, rgba(249,168,212,.38), transparent 32%),
        radial-gradient(circle at 94% 8%, rgba(139,92,246,.28), transparent 34%),
        linear-gradient(160deg,#fff 0%,#fcf7ff 46%,#f6efff 100%);
    }

    *{box-sizing:border-box}
    html{scroll-behavior:smooth}
    body{
      margin:0;
      min-height:100vh;
      color:var(--ink);
      background:var(--bg);
      font-family:Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    button,input,select,textarea{font:inherit}
    button{cursor:pointer}
    img{display:block;max-width:100%}
    .hidden{display:none!important}
    .container{width:min(1120px,calc(100% - 28px));margin:auto}
    .screen{min-height:100vh}
    .topbar{
      position:sticky;top:0;z-index:40;
      border-bottom:1px solid rgba(255,255,255,.7);
      background:rgba(255,255,255,.72);
      backdrop-filter:blur(18px);
    }
    .nav{
      height:72px;display:flex;align-items:center;justify-content:space-between;gap:14px;
    }
    .brand{
      display:flex;align-items:center;gap:11px;font-weight:900;letter-spacing:-.04em;font-size:1.2rem;
      border:0!important;background:transparent!important;box-shadow:none!important;padding:0!important;
      border-radius:0!important;
    }
    .brand:hover{transform:none!important;background:transparent!important}
    .brand-mark{
      width:44px;height:44px;border-radius:16px;display:grid;place-items:center;color:white;
      background:linear-gradient(145deg,var(--purple-800),var(--purple-500) 65%,var(--pink-500));
      box-shadow:0 12px 28px rgba(91,33,182,.25);
    }
    .brand-mark svg{width:24px}
    .brand-paw{width:24px;height:24px;object-fit:contain;display:block}
    .nav-actions{display:flex;align-items:center;gap:8px}
    .btn{
      border:0;border-radius:16px;padding:13px 18px;font-weight:800;
      display:inline-flex;align-items:center;justify-content:center;gap:9px;
      transition:.22s ease;white-space:nowrap;text-decoration:none;
    }
    .btn:hover{transform:translateY(-2px)}
    .btn:active{transform:scale(.98)}
    .btn-primary{
      color:white;background:linear-gradient(135deg,var(--purple-800),var(--purple-600) 60%,var(--pink-500));
      box-shadow:0 13px 26px rgba(91,33,182,.26);
    }
    .btn-soft{color:var(--purple-800);background:rgba(255,255,255,.76);border:1px solid var(--line)}
    .btn-ghost{color:var(--purple-800);background:transparent}
    .btn-danger{color:white;background:linear-gradient(135deg,#be123c,#e11d48)}
    .btn-success{color:white;background:linear-gradient(135deg,#0f8a57,#24b47e)}
    .btn-sm{padding:10px 13px;border-radius:13px;font-size:.9rem}
    .icon-btn{
      width:42px;height:42px;padding:0;border-radius:14px;border:1px solid var(--line);
      background:rgba(255,255,255,.8);display:grid;place-items:center;color:var(--purple-800)
    }
    .hero{
      padding:76px 0 48px;
      display:grid;grid-template-columns:1.1fr .9fr;align-items:center;gap:54px;
    }
    .eyebrow{
      display:inline-flex;align-items:center;gap:8px;padding:8px 12px;border-radius:999px;
      color:var(--purple-800);background:rgba(255,255,255,.76);border:1px solid var(--line);
      font-weight:850;font-size:.84rem;box-shadow:var(--shadow-soft)
    }
    h1,h2,h3,p{margin-top:0}
    h1{
      font-size:clamp(2.6rem,7vw,5.5rem);line-height:.93;letter-spacing:-.065em;
      margin:24px 0 22px;max-width:760px;
    }
    .gradient-text{
      background:linear-gradient(120deg,var(--purple-800),var(--purple-500),var(--pink-500));
      -webkit-background-clip:text;background-clip:text;color:transparent;
    }
    .hero-copy>p{font-size:clamp(1rem,2vw,1.18rem);line-height:1.75;color:var(--muted);max-width:650px}
    .hero-actions{display:flex;flex-wrap:wrap;gap:12px;margin-top:28px}
    .trust-row{display:flex;flex-wrap:wrap;gap:18px;margin-top:28px;color:var(--muted);font-weight:750;font-size:.91rem}
    .trust-row span{display:flex;align-items:center;gap:7px}
    .visual-wrap{position:relative;min-height:500px}
    .blob{
      position:absolute;inset:8% 0 0 4%;border-radius:46% 54% 55% 45% / 43% 41% 59% 57%;
      background:linear-gradient(145deg,rgba(91,33,182,.18),rgba(236,72,153,.20));
      filter:blur(.2px);
    }
    .pet-preview{
      position:absolute;inset:20px 20px 20px 34px;padding:20px;
      border:1px solid rgba(255,255,255,.82);border-radius:40px;
      background:rgba(255,255,255,.62);backdrop-filter:blur(20px);box-shadow:var(--shadow);
      transform:rotate(2deg);
    }
    .pet-photo{
      height:310px;border-radius:30px;overflow:hidden;position:relative;
      background:linear-gradient(145deg,#ead7ff,#ffd7e8);
    }
    .pet-photo img{width:100%;height:100%;object-fit:cover}
    .pet-code{
      position:absolute;right:16px;top:16px;background:rgba(255,255,255,.9);padding:9px 12px;
      border-radius:999px;color:var(--purple-800);font-weight:900;box-shadow:var(--shadow-soft)
    }
    .preview-body{padding:20px 5px 4px}
    .preview-body h3{font-size:1.65rem;margin-bottom:7px}
    .preview-body p{color:var(--muted);margin-bottom:15px}
    .preview-actions{display:grid;grid-template-columns:1fr 1fr;gap:10px}
    .mini-action{padding:12px;border-radius:16px;text-align:center;font-weight:850;background:var(--pink-100);color:var(--purple-800)}
    .floating-note{
      position:absolute;left:-10px;bottom:46px;padding:14px 17px;border-radius:18px;background:white;
      box-shadow:var(--shadow-soft);font-weight:850;transform:rotate(-4deg)
    }
    .section{padding:74px 0}
    .section-head{text-align:center;max-width:700px;margin:0 auto 34px}
    .section-head h2{font-size:clamp(2rem,5vw,3.4rem);letter-spacing:-.05em;margin-bottom:14px}
    .section-head p{color:var(--muted);line-height:1.7}
    .feature-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}
    .glass-card{
      border:1px solid rgba(255,255,255,.82);background:var(--glass);backdrop-filter:blur(18px);
      box-shadow:var(--shadow-soft);border-radius:var(--radius-lg);
    }
    .feature-card{padding:26px}
    .feature-icon{
      width:50px;height:50px;border-radius:18px;display:grid;place-items:center;margin-bottom:18px;
      background:linear-gradient(145deg,var(--pink-100),#eee7ff);color:var(--purple-700);font-size:1.35rem
    }
    .feature-card h3{margin-bottom:9px}.feature-card p{color:var(--muted);line-height:1.65;margin:0}
    .form-shell{max-width:900px;margin:34px auto;padding:22px}
    .form-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:16px}
    .field{display:flex;flex-direction:column;gap:8px}
    .field.full{grid-column:1/-1}
    label{font-weight:850;font-size:.92rem}
    .hint{font-size:.78rem;color:var(--muted);font-weight:600}
    input,select,textarea{
      width:100%;border:1px solid var(--line);background:rgba(255,255,255,.88);color:var(--ink);
      border-radius:16px;padding:14px 15px;outline:none;transition:.2s;min-height:50px;
    }
    textarea{min-height:104px;resize:vertical}
    input:focus,select:focus,textarea:focus{
      border-color:rgba(124,58,237,.55);box-shadow:0 0 0 4px rgba(124,58,237,.10)
    }
    .photo-picker{
      display:grid;grid-template-columns:120px 1fr;gap:18px;align-items:center;padding:14px;
      border:1px dashed rgba(124,58,237,.35);border-radius:20px;background:rgba(255,255,255,.5)
    }
    .photo-preview{
      width:120px;height:120px;border-radius:24px;overflow:hidden;display:grid;place-items:center;
      background:linear-gradient(145deg,#eee4ff,#ffe2ee);color:var(--purple-700);font-size:2rem
    }
    .photo-preview img{width:100%;height:100%;object-fit:cover}
    .form-actions{display:flex;justify-content:flex-end;gap:10px;margin-top:20px;flex-wrap:wrap}
    .notice{
      padding:14px 16px;border-radius:16px;font-weight:750;line-height:1.45;margin-bottom:18px;
      background:#f0fdf6;color:#116740;border:1px solid #c8f2dc
    }
    .notice.error{background:#fff1f3;color:#a7153d;border-color:#ffc7d3}
    .admin-login{max-width:460px;margin:72px auto;padding:28px}
    .admin-login h2{font-size:2rem;letter-spacing:-.04em}
    .admin-login p{color:var(--muted)}
    .stack{display:grid;gap:14px}
    .dashboard{padding:30px 0 70px}
    .dashboard-head{display:flex;align-items:flex-start;justify-content:space-between;gap:20px;margin-bottom:22px}
    .dashboard-head h1{font-size:clamp(2.1rem,6vw,4rem);margin:0 0 10px}
    .dashboard-head p{color:var(--muted);margin:0}
    .stats{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-bottom:18px}
    .stat{padding:22px}
    .stat .label{color:var(--muted);font-weight:800;font-size:.85rem}
    .stat .value{font-size:2rem;font-weight:950;letter-spacing:-.05em;margin-top:7px}
    .admin-card{padding:20px}
    .toolbar{display:grid;grid-template-columns:1.25fr repeat(3,.7fr);gap:10px;margin-bottom:18px}
    .table-wrap{overflow:auto;border-radius:18px;border:1px solid var(--line);background:rgba(255,255,255,.72)}
    table{width:100%;border-collapse:collapse;min-width:900px}
    th,td{padding:14px 13px;text-align:left;border-bottom:1px solid rgba(92,33,182,.09);vertical-align:middle}
    th{font-size:.78rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);background:rgba(247,242,255,.9)}
    td{font-size:.92rem}
    .pet-cell{display:flex;align-items:center;gap:11px}
    .thumb{width:48px;height:48px;border-radius:15px;object-fit:cover;background:#efe6ff}
    .badge{display:inline-flex;padding:7px 10px;border-radius:999px;background:#f0e9ff;color:var(--purple-800);font-weight:900;font-size:.78rem}
    .actions{display:flex;gap:7px;flex-wrap:wrap}
    .empty{text-align:center;padding:46px 16px;color:var(--muted)}
    .public-page{padding:38px 0 80px}
    .public-shell{max-width:720px;margin:auto}
    .public-cover{
      border-radius:34px;overflow:hidden;height:410px;position:relative;background:linear-gradient(145deg,#e7d5ff,#ffd6e5);
      box-shadow:var(--shadow)
    }
    .public-cover img{width:100%;height:100%;object-fit:cover}
    .public-code{position:absolute;right:18px;top:18px}
    .public-body{margin-top:-42px;position:relative;padding:28px}
    .public-body h1{font-size:clamp(2.2rem,8vw,4.2rem);margin:0 0 10px}
    .pet-meta{display:flex;flex-wrap:wrap;gap:9px;margin:18px 0}
    .meta-chip{padding:9px 12px;border-radius:999px;background:rgba(255,255,255,.84);border:1px solid var(--line);font-weight:800}
    .contact-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin-top:20px}
    .contact-card{padding:18px;border-radius:20px;text-decoration:none;color:var(--ink);background:white;border:1px solid var(--line);transition:.2s}
    .contact-card:hover{transform:translateY(-3px);box-shadow:var(--shadow-soft)}
    .contact-card strong{display:block;color:var(--purple-800);margin-bottom:5px}
    .reward{grid-column:1/-1;background:linear-gradient(135deg,#fff7ed,#fff1f2)}
    .footer{text-align:center;padding:30px;color:var(--muted);font-size:.88rem}
    .modal{
      position:fixed;inset:0;background:rgba(32,12,58,.48);backdrop-filter:blur(8px);z-index:80;
      display:grid;place-items:center;padding:18px;
    }
    .modal-card{width:min(680px,100%);max-height:90vh;overflow:auto;padding:24px}
    .modal-head{display:flex;align-items:center;justify-content:space-between;gap:14px;margin-bottom:16px}
    .toast{
      position:fixed;right:18px;bottom:18px;z-index:120;max-width:360px;padding:15px 18px;border-radius:17px;
      background:#25143d;color:white;box-shadow:var(--shadow);font-weight:800;transform:translateY(25px);opacity:0;
      pointer-events:none;transition:.25s
    }
    .toast.show{transform:translateY(0);opacity:1}
    .security-note{font-size:.82rem;color:var(--muted);line-height:1.55;margin-top:15px}
    @media(max-width:850px){
      .hero{grid-template-columns:1fr;padding-top:48px}.visual-wrap{min-height:470px}
      .feature-grid,.stats{grid-template-columns:1fr}.toolbar{grid-template-columns:1fr 1fr}
    }
    @media(max-width:620px){
      .nav{height:66px}.nav-actions .hide-mobile{display:none}
      .hero{gap:28px}.visual-wrap{min-height:420px}.pet-preview{inset:10px}.pet-photo{height:250px}
      .floating-note{left:3px;bottom:20px;font-size:.82rem}
      .form-shell{padding:15px}.form-grid{grid-template-columns:1fr}.field.full{grid-column:auto}
      .photo-picker{grid-template-columns:90px 1fr}.photo-preview{width:90px;height:90px}
      .toolbar{grid-template-columns:1fr}.dashboard-head{flex-direction:column}
      .contact-grid{grid-template-columns:1fr}.reward{grid-column:auto}
      .public-cover{height:330px;border-radius:26px}.public-body{padding:20px;margin-top:-30px}
      .hero-actions .btn{width:100%}
    }
  </style>
</head>

    function registerView(pet=null){

          <span class="eyebrow">${pet ? "Editar registro" : "Nuevo registro"}</span>

              ${field("district","Distrito *","text",pet?.district||"","Ej. Chorrillos")}
              ${field("reward","Recompensa","number",pet?.reward||"","Ej. 100","min='0' step='0.01'")}

    function field(id,label,type,value,placeholder,extra=""){
      return `<div class="field"><label for="${id}">${label}</label><input id="${id}" type="${type}" value="${escapeHTML(value)}" placeholder="${placeholder}" ${label.includes("*")?"required":""} ${extra}></div>`;
    }

    function previewPhoto(e){
      const file=e.target.files[0];
      if(!file) return;
      if(file.size > 2.5*1024*1024){ notify("La imagen debe pesar menos de 2.5 MB."); e.target.value=""; return; }
      const reader=new FileReader();
      reader.onload=()=>{ pendingPhoto=reader.result; $("#photoPreview").innerHTML=`<img src="${pendingPhoto}" alt="Vista previa">`; };
      reader.readAsDataURL(file);
    }

    function nextCode(pets){
      const max = pets.reduce((m,p)=>Math.max(m,parseInt(p.code.replace("#",""))||0),0);
      return `#${String(max+1).padStart(4,"0")}`;
    }

    function savePet(e){
      e.preventDefault();
      const values = {
        name: $("#name").value.trim(), breed: $("#breed").value.trim(), color: $("#color").value.trim(),
        age: $("#age").value.trim(), sex: $("#sex").value, whatsapp: $("#whatsapp").value.replace(/[^\d+]/g,""),
        district: $("#district").value.trim(), address: $("#address").value.trim(), reward: $("#reward").value
      };
      if(!pendingPhoto){ showFormError("Agrega una foto de la mascota."); return; }
      if(Object.entries(values).some(([k,v])=>["name","breed","color","age","sex","whatsapp","district"].includes(k)&&!v)){
        showFormError("Completa todos los campos obligatorios."); return;
      }
      if(values.whatsapp.replace(/\D/g,"").length < 9){ showFormError("Ingresa un número de WhatsApp válido."); return; }

      let pets=getPets();
      let code=editingCode;
      if(editingCode){
        const index=pets.findIndex(p=>p.code===editingCode);
        if(index<0){ showFormError("No se encontró el registro."); return; }
        pets[index]={...pets[index],...values,photo:pendingPhoto,updatedAt:new Date().toISOString()};
      }else{
        code=nextCode(pets);
        pets.unshift({...values,code,photo:pendingPhoto,createdAt:new Date().toISOString(),updatedAt:new Date().toISOString()});
      }
      try{
        savePets(pets);
        notify(editingCode ? "Cambios guardados correctamente." : `Mascota registrada correctamente con el código ${code}.`);
        location.hash=`mascota/${code.replace("#","")}`;
        render();
      }catch(err){
        showFormError("No se pudo guardar. Prueba con una imagen más liviana.");
      }
    }

    function showFormError(message){ $("#formNotice").innerHTML=`<div class="notice error">${escapeHTML(message)}</div>`; window.scrollTo({top:0,behavior:"smooth"}); }

    function publicView(code){
      const pet=getPets().find(p=>p.code.replace("#","")===code);
      if(!pet) return notFoundView();
      const wa=pet.whatsapp.replace(/\D/g,"");
      const message=encodeURIComponent(`Hola, vi la plaquita de ${pet.name} (${pet.code}).`);
      const mapQuery=encodeURIComponent(`${pet.address || pet.district}, ${pet.district}, Perú`);
      return `${nav()}
      <main class="container public-page">
        <div class="public-shell">
          <div class="public-cover">
            <img src="${pet.photo}" alt="${escapeHTML(pet.name)}">
            <span class="badge public-code">${pet.code}</span>
          </div>
          <section class="glass-card public-body">
            <span class="eyebrow">🐾 Perfil de mascota</span>
            <h1>Hola, soy <span class="gradient-text">${escapeHTML(pet.name)}</span></h1>
            <p style="color:var(--muted);line-height:1.7">Esta es mi información. Si me encontraste o sabes algo sobre mí, comunícate con mi familia.</p>
            <div class="pet-meta">
              <span class="meta-chip">Raza: ${escapeHTML(pet.breed)}</span>
              <span class="meta-chip">Color: ${escapeHTML(pet.color)}</span>
              <span class="meta-chip">Edad: ${escapeHTML(pet.age)}</span>
              <span class="meta-chip">${escapeHTML(pet.sex)}</span>
              <span class="meta-chip">Distrito: ${escapeHTML(pet.district)}</span>
            </div>
            <div class="contact-grid">
              <a class="contact-card" href="https://wa.me/${wa}?text=${message}" target="_blank" rel="noopener">
                <strong>💬 WhatsApp</strong><span>Contactar a mi familia</span>
              </a>
              <a class="contact-card" href="https://www.google.com/maps/search/?api=1&query=${mapQuery}" target="_blank" rel="noopener">
                <strong>📍 Ubicación aproximada</strong><span>${escapeHTML(pet.address || pet.district)}</span>
              </a>
              <div class="contact-card reward"><strong>🎁 Recompensa</strong><span>${formatMoney(pet.reward)}</span></div>
            </div>
            <div class="form-actions">
              <button class="btn btn-primary" onclick="window.open('https://wa.me/${wa}?text=${message}','_blank')">Enviar mensaje</button>
            </div>
          </section>
        </div>
      </main>`;
    }

    function login(e){

    function renderPetTable(pets){
      if(!pets.length) return `<div class="empty">No hay registros todavía.</div>`;
      return `<div class="table-wrap"><table><thead><tr><th>Mascota</th><th>Código</th><th>Raza</th><th>Distrito</th><th>Recompensa</th><th>Acciones</th></tr></thead>
      <tbody>${pets.map(p=>`<tr data-search="${escapeHTML([p.name,p.breed,p.code,p.district].join(" ").toLowerCase())}" data-district="${escapeHTML(p.district)}" data-sex="${escapeHTML(p.sex)}">
        <td><div class="pet-cell"><img class="thumb" src="${p.photo}" alt=""><div><b>${escapeHTML(p.name)}</b><br><small>${escapeHTML(p.sex)} · ${escapeHTML(p.age)}</small></div></div></td>
        <td><span class="badge">${p.code}</span></td><td>${escapeHTML(p.breed)}</td><td>${escapeHTML(p.district)}</td><td>${formatMoney(p.reward)}</td>

          <button class="icon-btn" title="Eliminar" onclick="deletePet('${p.code}')">🗑</button>
        </div></td></tr>`).join("")}</tbody></table></div>`;
    }

    function filterPets(){
      const q=$("#search").value.trim().toLowerCase(), d=$("#districtFilter").value, s=$("#sexFilter").value;
      document.querySelectorAll("#petTable tbody tr").forEach(row=>{
        row.style.display=(!q||row.dataset.search.includes(q))&&(!d||row.dataset.district===d)&&(!s||row.dataset.sex===s)?"":"none";
      });
    }

    function editPet(code){
      const pet=getPets().find(p=>p.code===code); if(!pet)return;
      window.__editPet=pet; location.hash=`editar/${code.replace("#","")}`; render();
    }

    function deletePet(code){
      const pet=getPets().find(p=>p.code===code);
      if(!pet||!confirm(`¿Eliminar definitivamente el registro de ${pet.name}?`)) return;
      savePets(getPets().filter(p=>p.code!==code)); notify("Registro eliminado."); render();

            <div class="field"><label>Nuevo usuario</label><input id="newUser" value="${escapeHTML(a.username)}" required></div>
            <div class="field"><label>Nueva contraseña</label><input id="newPass" type="password" minlength="6" placeholder="Mínimo 6 caracteres" required></div>
            <button class="btn btn-primary">Guardar credenciales</button>
          </form>
        </section></div>`);
    }
    function closeModal(){ $("#credentialsModal")?.remove(); }
    function updateCredentials(e){
      e.preventDefault(); saveAdmin({username:$("#newUser").value.trim(),password:$("#newPass").value});
      closeModal(); notify("Credenciales actualizadas.");
    }

    function notFoundView(){ return `${nav()}<main class="container section"><section class="glass-card admin-login"><h2>Perfil no encontrado</h2><p>El código indicado no existe o fue eliminado.</p><button class="btn btn-primary" onclick="goHome()">Volver al inicio</button></section></main>`; }

    function copyPetLink(code){
      const link = profileURL(code);
      copyText(link, `Enlace único de ${code} copiado.`);
    }

    function copyText(text, message="Enlace copiado."){
      if(navigator.clipboard && window.isSecureContext){
        navigator.clipboard.writeText(text)
          .then(()=>notify(message))
          .catch(()=>fallbackCopy(text, message));
      }else{
        fallbackCopy(text, message);
      }
    }

    function fallbackCopy(text, message){
      const t=document.createElement("textarea");
      t.value=text;
      t.setAttribute("readonly","");
      t.style.position="fixed";
      t.style.opacity="0";
      document.body.appendChild(t);
      t.select();
      t.setSelectionRange(0,99999);
      document.execCommand("copy");
      t.remove();
      notify(message);
    }
    function notify(message){
      const t=$("#toast"); t.textContent=message;t.classList.add("show");clearTimeout(window.__toast);window.__toast=setTimeout(()=>t.classList.remove("show"),2700);
    }

    function render(){
      let hash=location.hash.replace("#","");
      const queryPet = new URLSearchParams(location.search).get("mascota");
      if(!hash && queryPet) hash=`mascota/${queryPet}`;
      const [route,param]=hash.split("/");
      let view;
      if(route==="registro") view=registerView();
      else if(route==="mascota") view=publicView(param||"");
      else if(route==="admin") view=adminView();
      else if(route==="editar"){
        if(!isAdmin()){ location.hash="admin"; return render(); }
        const pet=getPets().find(p=>p.code.replace("#","")===param); view=pet?registerView(pet):notFoundView();
      } else view=homeView();
      $("#app").innerHTML=view; window.scrollTo(0,0);
    }
    window.addEventListener("hashchange",render);
    render();
  </script>
</body>
</html>
